[project]
name = "trenchbroom-mcp"
version = "0.1.0"
description = "MCP bridge for driving TrenchBroom's map editor"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
]

[project.scripts]
trenchbroom-mcp = "trenchbroom_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trenchbroom_mcp"]
